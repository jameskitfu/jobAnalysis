# 大模型 Provider 配置
# 支持多 Provider 备份和切换
# 注意：API Key 改为前端传入，此处仅配置默认参数

# 主 Provider（通义千问 - 阿里云）
aliyun:
  enabled: true
  model: qwen-max
  priority: 1  # 优先级（数字越小优先级越高）
  max_requests: 10  # 每分钟最大请求数
  timeout: 30  # 超时时间（秒）
  batch_size: 10  # 批量处理大小
  cache_ttl: 3600  # 缓存过期时间（秒）

# 备用 Provider（文心一言 - 百度）
baidu:
  enabled: false  # 默认禁用，需要时启用
  model: ernie-bot-4
  priority: 2
  max_requests: 20
  timeout: 30
  batch_size: 10
  cache_ttl: 3600

# 备用 Provider（讯飞星火）
iflytek:
  enabled: false
  model: spark-v3.5
  priority: 3
  max_requests: 15
  timeout: 30
  batch_size: 5
  cache_ttl: 3600

# 新增：小米 Mimo
xiaomi:
  enabled: true
  model: mimo-lite
  priority: 4
  max_requests: 10
  timeout: 30
  batch_size: 10
  cache_ttl: 3600

# 新增：深度求索（DeepSeek）
deepseek:
  enabled: true
  model: deepseek-chat
  priority: 5
  max_requests: 10
  timeout: 30
  batch_size: 10
  cache_ttl: 3600

# 降级策略
fallback:
  # LLM 失败后是否降级为 Jieba 模式
  enable_jieba_fallback: true
  # 重试次数
  max_retries: 3
  # 重试延迟基数（秒，指数退避）
  retry_base_delay: 1.0
  # 最大重试延迟（秒）
  retry_max_delay: 8.0

# 成本监控
cost_monitoring:
  # 月度预算（元）
  monthly_budget: 300
  # 告警阈值（达到预算的百分比时告警）
  alert_threshold: 0.8
  # 自动停止阈值（达到预算的百分比时停止 LLM 调用）
  stop_threshold: 1.0
