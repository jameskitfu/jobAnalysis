name: Build Desktop Apps

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos-intel:
    runs-on: macos-12
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          export PYINSTALLER_CONFIG_DIR="/tmp/pyinstaller_config"
          mkdir -p "$PYINSTALLER_CONFIG_DIR"
          pyinstaller jobAnalysis.spec --noconfirm

      - name: Create DMG
        run: |
          hdiutil create \
            -volname "技能词频统计工具" \
            -srcfolder "dist/技能词频统计工具.app" \
            -ov -format UDZO \
            "dist/SkillAnalyzer_v${{ github.ref_name }}_macOS_Intel.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-intel-dmg
          path: dist/*.dmg

  build-macos-arm:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          export PYINSTALLER_CONFIG_DIR="/tmp/pyinstaller_config"
          mkdir -p "$PYINSTALLER_CONFIG_DIR"
          pyinstaller jobAnalysis.spec --noconfirm

      - name: Create DMG
        run: |
          hdiutil create \
            -volname "技能词频统计工具" \
            -srcfolder "dist/技能词频统计工具.app" \
            -ov -format UDZO \
            "dist/SkillAnalyzer_v${{ github.ref_name }}_macOS_Apple_Silicon.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm-dmg
          path: dist/*.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller jobAnalysis_win.spec --noconfirm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/*.exe

  release:
    needs: [build-macos-intel, build-macos-arm, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "技能词频统计工具 ${{ github.ref_name }}"
          body: |
            ## 下载安装包
            - **Windows**: 下载 `.exe` 文件，双击运行
            - **macOS Intel**: 下载 `_Intel.dmg`，拖入应用程序文件夹
            - **macOS Apple Silicon (M1/M2/M3)**: 下载 `_Apple_Silicon.dmg`
          files: |
            windows-exe/*.exe
            macos-intel-dmg/*.dmg
            macos-arm-dmg/*.dmg
